<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-hearts" aria-hidden="true"></div>

    <main class="card" id="card">
        <div class="cute-scene" id="cuteScene" aria-hidden="true">
            <span class="scene-emoji bounce-a">🧸</span>
            <span class="scene-emoji bounce-b">💕</span>
            <span class="scene-emoji bounce-c">🌸</span>
        </div>

        <h1 id="title">Will you be my Valentine? 💕</h1>
        <p id="message" class="message">I've been wanting to ask you something...</p>

        <div class="buttons">
            <button id="yesBtn" class="yes-btn" type="button" aria-label="Yes, I'll be your Valentine">
                Yes 💖
            </button>
            <button id="noBtn" class="no-btn" type="button" aria-label="No">
                No
            </button>
        </div>
    </main>

    <section id="celebration" class="celebration hidden" aria-hidden="true">
        <div class="confetti" id="confetti"></div>
        <div class="celebration-content">
            <h1 class="yay">YAY!!! 💖💖💖</h1>
            <p class="happiest">You just made me the happiest person ever 🥰</p>
            <div class="hearts-row" aria-hidden="true">
                <span>💘</span><span>💝</span><span>💖</span><span>💗</span><span>💓</span>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
